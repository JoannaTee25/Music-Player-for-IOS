name: MyTracks
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  MyTracks:
    type: application
    platform: iOS
    sources: [MyTracks]
    info:
      path: MyTracks/Info.plist
      properties:
        CFBundleDisplayName: My Songs
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: "MyTracks uses your local Wi-Fi to let you upload MP3 files directly from your laptop's web browser."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mytracks
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
